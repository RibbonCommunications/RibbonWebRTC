name: Publish WebRTC to CocoaPods

on:
  push:
    tags:
      - '0.*'
    branches:
      - codex/publish-webrtc-0.142.0

permissions:
  contents: read

concurrency:
  group: publish-webrtc-${{ github.ref_type == 'tag' && github.ref_name || '0.142.0' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_type == 'tag' && github.ref_name || '0.142.0' }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.0'
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Verify release and publish
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '0.142.0' }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::Configure COCOAPODS_TRUNK_TOKEN for the RibbonWebRTC repository."
            exit 1
          fi
          version=$(pod ipc spec RibbonWebRTC.podspec | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("version")')
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "::error::The release tag must match the podspec version."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$(git rev-parse HEAD)" != "e0221fa686aa493f3cadc1a22098926749a0a23e" ]; then
            echo "::error::The branch-triggered release must use the verified 0.142.0 payload."
            exit 1
          fi
          pod trunk me > /dev/null
          published_versions=$(curl -fsS https://trunk.cocoapods.org/api/v1/pods/RibbonWebRTC)
          if printf '%s' "$published_versions" | ruby -rjson -e 'exit(JSON.parse(STDIN.read).fetch("versions").any? { |v| v.fetch("name") == ARGV[0] } ? 0 : 1)' "$RELEASE_TAG"; then
            echo "RibbonWebRTC $RELEASE_TAG is already published."
            exit 0
          fi
          pod trunk push RibbonWebRTC.podspec --allow-warnings
